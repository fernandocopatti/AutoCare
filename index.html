<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --primary-light: #dbeafe;
      --success: #059669;
      --success-bg: #d1fae5;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --info: #0284c7;
      --info-bg: #e0f2fe;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -2px rgba(0,0,0,.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== LOGIN ===== */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(145deg, #0f172a 0%, #1e3a8a 50%, #1e40af 100%);
    }
    .login-box {
      background: var(--surface);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.35);
    }
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .login-logo .icon {
      width: 48px; height: 48px;
      background: var(--primary);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 24px;
    }
    .login-box h1 { font-size: 26px; font-weight: 700; text-align: center; letter-spacing: -0.02em; }
    .login-box .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 36px; font-size: 15px; }
    .profile-buttons { display: flex; flex-direction: column; gap: 12px; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
      border: none; cursor: pointer; transition: all .15s ease;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline {
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #047857; }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: none; }
    .btn-ghost:hover { background: var(--bg); color: var(--text); }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    .btn-block { width: 100%; }
    .btn-icon {
      width: 36px; height: 36px; padding: 0; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* ===== APP SHELL ===== */
    .app { display: none; min-height: 100vh; flex-direction: column; }
    .app.active { display: flex; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 18px; color: var(--primary);
    }
    .topbar-brand .icon {
      width: 36px; height: 36px; background: var(--primary);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-owner { background: var(--primary-light); color: var(--primary); }
    .badge-shop { background: var(--success-bg); color: #065f46; }

    .nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; overflow-x: auto; padding: 0 16px;
      gap: 4px;
    }
    .nav button {
      padding: 14px 16px; background: none; border: none;
      font-size: 14px; font-weight: 500; color: var(--muted);
      cursor: pointer; white-space: nowrap;
      border-bottom: 2px solid transparent;
      display: flex; align-items: center; gap: 8px;
      font-family: inherit; transition: all .15s;
    }
    .nav button:hover { color: var(--text); }
    .nav button.active {
      color: var(--primary); border-bottom-color: var(--primary); font-weight: 600;
    }
    .nav button .nav-icon { font-size: 16px; }

    main {
      flex: 1; padding: 28px 24px;
      max-width: 860px; margin: 0 auto; width: 100%;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ===== CARDS & UI ===== */
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .page-header h2 {
      font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    }
    .page-header p { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: var(--shadow-md); }

    .vehicle-card .card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 16px;
    }
    .vehicle-card h3 { font-size: 17px; font-weight: 600; }
    .vehicle-card .meta { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .km-badge {
      background: #0f172a; color: white;
      padding: 6px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
    }

    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .stat-label { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-value { font-size: 15px; font-weight: 600; margin-top: 2px; }

    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: none; padding-bottom: 0; }
    .list-item:first-child { padding-top: 0; }

    .status {
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
      white-space: nowrap;
    }
    .status.ok { background: var(--success-bg); color: #065f46; }
    .status.warn { background: var(--warning-bg); color: #92400e; }
    .status.late { background: var(--danger-bg); color: #991b1b; }
    .status.info { background: var(--info-bg); color: #075985; }

    /* ===== FORMS ===== */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 500;
      margin-bottom: 6px; color: var(--text-secondary);
    }
    input, select, textarea {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 15px; background: var(--surface);
      font-family: inherit; color: var(--text);
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30,64,175,.12);
    }
    input[readonly] { background: #f1f5f9; color: var(--text-secondary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 520px) { .form-row, .stats-row { grid-template-columns: 1fr; } }

    .photo-area {
      border: 2px dashed var(--border); border-radius: 12px; padding: 28px;
      text-align: center; background: #f8fafc; cursor: pointer;
      transition: all .15s; color: var(--text-secondary); font-size: 14px;
    }
    .photo-area:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .photo-area img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 12px; }
    .photo-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
    .photo-thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

    .check-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .check-list label {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: var(--text); cursor: pointer;
      padding: 8px 12px; border-radius: 8px; margin: 0;
      transition: background .1s;
    }
    .check-list label:hover { background: var(--bg); }
    .check-list input { width: 18px; height: 18px; accent-color: var(--primary); }

    /* ===== AGENDA ===== */
    .agenda-day { margin-bottom: 28px; }
    .agenda-day h4 {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 12px;
    }
    .slot {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
      transition: all .15s;
    }
    .slot.occupied { background: #eff6ff; border-color: #bfdbfe; }
    .slot.free { background: #f0fdf4; border-color: #bbf7d0; }
    .slot .slot-time { font-weight: 600; font-size: 14px; }
    .slot .slot-meta { font-size: 13px; color: var(--text-secondary); }

    .empty-state {
      text-align: center; padding: 48px 24px; color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .6; }
    .empty-state p { font-size: 15px; }

    /* ===== MODAL ===== */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(15,23,42,.5);
      display: none; align-items: center; justify-content: center;
      z-index: 200; padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-bg.show { display: flex; animation: fadeIn .15s ease; }
    .modal {
      background: var(--surface); border-radius: 16px; padding: 28px;
      width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.25);
    }
    .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0f172a; color: white; padding: 12px 22px; border-radius: 10px;
      font-size: 14px; font-weight: 500; z-index: 300;
      opacity: 0; transition: all .25s ease; pointer-events: none;
      box-shadow: 0 10px 25px rgba(0,0,0,.2);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .actions-row { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="login-screen">
    <div class="login-box">
      <div class="login-logo">
        <div class="icon">🚗</div>
      </div>
      <h1>AutoCare</h1>
      <p class="subtitle">Gestão inteligente de manutenção e abastecimento</p>
      <div class="profile-buttons">
        <button class="btn btn-primary btn-block" onclick="entrar('dono')">
          <span>👤</span> Entrar como Proprietário
        </button>
        <button class="btn btn-outline btn-block" onclick="entrar('mecanica')">
          <span>🔧</span> Entrar como Mecânica
        </button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px;color:var(--muted);font-size:13px" onclick="location.reload()">
          🔄 Recarregar App
        </button>
        <button class="btn btn-ghost btn-block" style="color:var(--danger);font-size:13px" onclick="resetData()">
          🗑️ Limpar dados de teste
        </button>
      </div>
    </div>
  </div>

  <!-- APP DONO -->
  <div id="app-dono" class="app">
    <div class="topbar">
      <div class="topbar-brand"><div class="icon">🚗</div> AutoCare</div>
      <div class="topbar-right">
        <span class="badge badge-owner">👤 Proprietário</span>
        <button class="btn btn-sm btn-outline" onclick="sair()">Sair</button>
      </div>
    </div>
    <nav class="nav" id="nav-dono">
      <button class="active" data-tela="veiculos" onclick="mostrarTela('dono','veiculos')"><span class="nav-icon">🚙</span> Veículos</button>
      <button data-tela="abastecimento" onclick="mostrarTela('dono','abastecimento')"><span class="nav-icon">⛽</span> Abastecer</button>
      <button data-tela="manutencao" onclick="mostrarTela('dono','manutencao')"><span class="nav-icon">🛠️</span> Manutenções</button>
      <button data-tela="agendar" onclick="mostrarTela('dono','agendar')"><span class="nav-icon">📅</span> Agendar</button>
    </nav>
    <main>
      <div id="dono-veiculos" class="screen active"></div>
      <div id="dono-abastecimento" class="screen"></div>
      <div id="dono-manutencao" class="screen"></div>
      <div id="dono-agendar" class="screen"></div>
    </main>
  </div>

  <!-- APP MECÂNICA -->
  <div id="app-mecanica" class="app">
    <div class="topbar">
      <div class="topbar-brand"><div class="icon">🚗</div> AutoCare</div>
      <div class="topbar-right">
        <span class="badge badge-shop">🔧 Oficina Central</span>
        <button class="btn btn-sm btn-outline" onclick="sair()">Sair</button>
      </div>
    </div>
    <nav class="nav" id="nav-mecanica">
      <button class="active" data-tela="agenda" onclick="mostrarTela('mecanica','agenda')"><span class="nav-icon">📋</span> Agenda</button>
      <button data-tela="servicos" onclick="mostrarTela('mecanica','servicos')"><span class="nav-icon">✅</span> Serviços</button>
      <button data-tela="novo-servico" onclick="mostrarTela('mecanica','novo-servico')"><span class="nav-icon">➕</span> Registrar</button>
    </nav>
    <main>
      <div id="mecanica-agenda" class="screen active"></div>
      <div id="mecanica-servicos" class="screen"></div>
      <div id="mecanica-novo-servico" class="screen"></div>
    </main>
  </div>

  <!-- MODAL VEÍCULO -->
  <div id="modal-veiculo" class="modal-bg" onclick="if(event.target===this)fecharModal('modal-veiculo')">
    <div class="modal">
      <h2 id="modal-veiculo-titulo">Cadastrar Veículo</h2>
      <input type="hidden" id="v-id" value="" />
      <div class="form-group">
        <label>Marca</label>
        <select id="v-marca">
          <option value="">Selecione a marca</option>
          <option>Volkswagen</option><option>Fiat</option><option>Chevrolet</option>
          <option>Hyundai</option><option>Toyota</option><option>Honda</option>
          <option>Renault</option><option>Jeep</option><option>Ford</option>
          <option>Nissan</option><option>Peugeot</option><option>Citroën</option>
          <option>Mercedes-Benz</option><option>BMW</option><option>Audi</option>
          <option>Opel</option><option>Gurgel</option><option>Puma</option>
          <option>Willys</option><option>Simca</option><option>Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Modelo</label>
        <input type="text" id="v-modelo" placeholder="Ex: Golf 1.4 TSI" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Ano</label>
          <input type="number" id="v-ano" placeholder="Ex: 1973" min="1950" max="2027" />
        </div>
        <div class="form-group">
          <label>Placa</label>
          <input type="text" id="v-placa" placeholder="ABC1D23" maxlength="8" />
        </div>
      </div>
      <div class="form-group">
        <label>Km atual</label>
        <input type="number" id="v-km" placeholder="Ex: 45000" min="0" />
      </div>
      <div class="form-group">
        <button type="button" class="btn btn-outline btn-block" onclick="buscarDadosVeiculo()" style="border-style:dashed">
          🔍 Buscar dados do modelo na internet
        </button>
        <p style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center">
          Abre busca com manual, intervalos de manutenção e fichas técnicas
        </p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" onclick="fecharModal('modal-veiculo')">Cancelar</button>
        <button class="btn btn-primary btn-block" onclick="salvarVeiculo()">Salvar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ===================== CONSTANTS & DATA =====================
    const PREVENTIVAS = [
      { nome: 'Troca de óleo e filtro', intervaloKm: 10000 },
      { nome: 'Filtro de ar', intervaloKm: 20000 },
      { nome: 'Filtro de combustível', intervaloKm: 20000 },
      { nome: 'Pastilhas de freio', intervaloKm: 20000 },
      { nome: 'Correia dentada', intervaloKm: 60000 },
      { nome: 'Fluido de freio', intervaloKm: 30000 },
      { nome: 'Velas de ignição', intervaloKm: 40000 },
    ];
    const HORARIOS = ['08:00','09:00','10:00','11:00','14:00','15:00','16:00','17:00'];

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function defaultData() {
      return {
        veiculos: [
          { id: 'v1', marca: 'Volkswagen', modelo: 'Golf 1.4 TSI', ano: 2018, placa: 'ABC1D23', km: 87450, ultimoAbastKm: 87450 },
          { id: 'v2', marca: 'Fiat', modelo: 'Argo 1.0', ano: 2021, placa: 'XYZ9K87', km: 34210, ultimoAbastKm: 34210 },
        ],
        abastecimentos: [
          { id: 'a1', veiculoId: 'v1', data: '2026-09-12', km: 87450, litros: 42.3, valor: 265.40 },
          { id: 'a2', veiculoId: 'v1', data: '2026-08-28', km: 86890, litros: 38.7, valor: 241.10 },
        ],
        oficinas: [
          { id: 'o1', nome: 'Oficina Central', nota: 4.8, distancia: '2,1 km' },
          { id: 'o2', nome: 'Auto Center Silva', nota: 4.6, distancia: '3,4 km' },
          { id: 'o3', nome: 'Mecânica do João', nota: 4.9, distancia: '5,0 km' },
        ],
        agendamentos: [
          { id: 'ag1', veiculoId: 'v1', oficinaId: 'o1', data: '2026-09-21', hora: '09:00', servico: 'Troca de óleo', status: 'em_andamento', cliente: 'Carlos Mendes', notas: '' },
          { id: 'ag2', veiculoId: 'v2', oficinaId: 'o1', data: '2026-09-21', hora: '14:30', servico: 'Freios', status: 'confirmado', cliente: 'Ana Souza', notas: '' },
          { id: 'ag3', veiculoId: null, oficinaId: 'o1', data: '2026-09-22', hora: '15:00', servico: 'Revisão', status: 'confirmado', cliente: 'Roberto Lima', notas: 'Civic 2019' },
        ],
        servicos: [
          { id: 's1', veiculoId: 'v1', oficinaId: 'o1', data: '2026-07-15', km: 85900, itens: ['Troca de óleo', 'Filtro de óleo'], fotos: [], observacoes: 'Óleo 5W40 sintético', cliente: 'Carlos Mendes' },
        ],
        ultimaManutencao: {
          v1: { 'Troca de óleo e filtro': 85900 },
          v2: {},
        }
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem('autocare_v2');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return defaultData();
    }

    function save() {
      localStorage.setItem('autocare_v2', JSON.stringify(DB));
    }

    let DB = load();

    // ===================== UTILS =====================
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function resetData() {
      if (confirm('Apagar todos os dados e voltar ao estado inicial?')) {
        localStorage.removeItem('autocare_v2');
        DB = defaultData();
        save();
        toast('Dados reiniciados');
        setTimeout(() => location.reload(), 400);
      }
    }

    function fecharModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function buscarDadosVeiculo() {
      const marca = document.getElementById('v-marca').value;
      const modelo = document.getElementById('v-modelo').value.trim();
      const ano = document.getElementById('v-ano').value;

      if (!marca && !modelo) {
        toast('Informe pelo menos a marca ou o modelo');
        return;
      }

      const partes = [];
      if (marca) partes.push(marca);
      if (modelo) partes.push(modelo);
      if (ano) partes.push(ano);

      const q = encodeURIComponent(partes.join(' ') + ' manual manutenção intervalos revisão especificação técnica');
      // Abre busca no Google (usuário pode ver manuais, fóruns, FIPE, etc.)
      window.open('https://www.google.com/search?q=' + q, '_blank', 'noopener');

      // Também oferece link direto para busca na Wikipedia (útil para carros clássicos)
      const wikiQ = encodeURIComponent((marca + ' ' + modelo).trim());
      setTimeout(() => {
        if (confirm('Abrir também a Wikipedia para dados históricos do modelo?')) {
          window.open('https://pt.wikipedia.org/w/index.php?search=' + wikiQ, '_blank', 'noopener');
        }
      }, 400);

      toast('Busca aberta em nova aba');
    }

    function fmtKm(n) {
      return (n || 0).toLocaleString('pt-BR');
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    // ===================== NAV =====================
    function entrar(perfil) {
      document.getElementById('login').style.display = 'none';
      if (perfil === 'dono') {
        document.getElementById('app-dono').classList.add('active');
        mostrarTela('dono', 'veiculos');
      } else {
        document.getElementById('app-mecanica').classList.add('active');
        mostrarTela('mecanica', 'agenda');
      }
    }

    function sair() {
      document.getElementById('app-dono').classList.remove('active');
      document.getElementById('app-mecanica').classList.remove('active');
      document.getElementById('login').style.display = 'flex';
    }

    function mostrarTela(perfil, tela) {
      document.querySelectorAll(`#app-${perfil} .screen`).forEach(s => s.classList.remove('active'));
      const screen = document.getElementById(`${perfil}-${tela}`);
      if (screen) screen.classList.add('active');

      document.querySelectorAll(`#nav-${perfil} button`).forEach(b => b.classList.remove('active'));
      const btn = document.querySelector(`#nav-${perfil} button[data-tela="${tela}"]`);
      if (btn) btn.classList.add('active');

      if (perfil === 'dono') {
        if (tela === 'veiculos') renderDonoVeiculos();
        if (tela === 'abastecimento') renderDonoAbastecimento();
        if (tela === 'manutencao') renderDonoManutencao();
        if (tela === 'agendar') renderDonoAgendar();
      } else {
        if (tela === 'agenda') renderMecanicaAgenda();
        if (tela === 'servicos') renderMecanicaServicos();
        if (tela === 'novo-servico') renderMecanicaNovoServico();
      }

    // ===================== VEÍCULOS =====================
    function abrirModalVeiculo(id = null) {
      const titulo = document.getElementById('modal-veiculo-titulo');
      document.getElementById('v-id').value = id || '';

      if (id) {
        const v = DB.veiculos.find(x => x.id === id);
        if (!v) return;
        titulo.textContent = 'Editar Veículo';
        document.getElementById('v-marca').value = v.marca;
        document.getElementById('v-modelo').value = v.modelo;
        document.getElementById('v-ano').value = v.ano;
        document.getElementById('v-placa').value = v.placa;
        document.getElementById('v-km').value = v.km;
      } else {
        titulo.textContent = 'Cadastrar Veículo';
        document.getElementById('v-marca').value = '';
        document.getElementById('v-modelo').value = '';
        document.getElementById('v-ano').value = '';
        document.getElementById('v-placa').value = '';
        document.getElementById('v-km').value = '';
      }
      document.getElementById('modal-veiculo').classList.add('show');
    }

    function salvarVeiculo() {
      const id = document.getElementById('v-id').value;
      const marca = document.getElementById('v-marca').value;
      const modelo = document.getElementById('v-modelo').value.trim();
      const ano = parseInt(document.getElementById('v-ano').value, 10);
      const placa = document.getElementById('v-placa').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      const km = parseInt(document.getElementById('v-km').value, 10);

      if (!marca) { toast('Selecione a marca'); return; }
      if (!modelo) { toast('Informe o modelo'); return; }
      if (!ano || ano < 1950 || ano > 2027) { toast('Ano inválido (1950–2027)'); return; }
      if (!placa || placa.length < 6) { toast('Placa inválida'); return; }
      if (isNaN(km) || km < 0) { toast('Informe o km atual'); return; }

      if (id) {
        // Edição
        const v = DB.veiculos.find(x => x.id === id);
        if (!v) { toast('Veículo não encontrado'); return; }
        v.marca = marca;
        v.modelo = modelo;
        v.ano = ano;
        v.placa = placa;
        // Só atualiza km se for maior ou igual
        if (km >= v.km) {
          v.km = km;
          if (!v.ultimoAbastKm || km > v.ultimoAbastKm) v.ultimoAbastKm = km;
        } else {
          v.km = km; // permite correção manual
        }
        toast('Veículo atualizado!');
      } else {
        // Novo
        const novo = {
          id: uid(),
          marca, modelo, ano, placa, km,
          ultimoAbastKm: km
        };
        DB.veiculos.push(novo);
        DB.ultimaManutencao[novo.id] = {};
        toast('Veículo cadastrado!');
      }

      save();
      fecharModal('modal-veiculo');
      renderDonoVeiculos();
    }

    function excluirVeiculo(id) {
      if (!confirm('Excluir este veículo e todo o histórico relacionado?')) return;
      DB.veiculos = DB.veiculos.filter(v => v.id !== id);
      DB.abastecimentos = DB.abastecimentos.filter(a => a.veiculoId !== id);
      DB.agendamentos = DB.agendamentos.filter(a => a.veiculoId !== id);
      DB.servicos = DB.servicos.filter(s => s.veiculoId !== id);
      delete DB.ultimaManutencao[id];
      save();
      toast('Veículo excluído');
      renderDonoVeiculos();
    }

    function calcProximaRevisao(v) {
      const ultima = (DB.ultimaManutencao[v.id] || {})['Troca de óleo e filtro'] || 0;
      const falta = 10000 - (v.km - ultima);
      if (falta <= 0) return { texto: 'Atrasada', cor: 'var(--danger)' };
      if (falta <= 2000) return { texto: `Em ${fmtKm(falta)} km`, cor: 'var(--warning)' };
      return { texto: `Em ${fmtKm(falta)} km`, cor: 'var(--success)' };
    }

    function ultimoAbastTexto(veiculoId) {
      const list = DB.abastecimentos.filter(a => a.veiculoId === veiculoId).sort((a, b) => b.data.localeCompare(a.data));
      return list[0] ? fmtDate(list[0].data) : '—';
    }

    function renderDonoVeiculos() {
      const el = document.getElementById('dono-veiculos');
      let html = `
        <div class="page-header">
          <div>
            <h2>Meus Veículos</h2>
            <p>${DB.veiculos.length} veículo${DB.veiculos.length !== 1 ? 's' : ''} cadastrado${DB.veiculos.length !== 1 ? 's' : ''}</p>
          </div>
          <button class="btn btn-primary" onclick="abrirModalVeiculo()">+ Novo veículo</button>
        </div>`;

      if (DB.veiculos.length === 0) {
        html += `<div class="card empty-state"><div class="empty-icon">🚙</div><p>Nenhum veículo cadastrado.<br>Clique em “Novo veículo” para começar.</p></div>`;
      } else {
        DB.veiculos.forEach(v => {
          const prox = calcProximaRevisao(v);
          html += `
            <div class="card vehicle-card">
              <div class="card-top">
                <div>
                  <h3>${v.marca} ${v.modelo}</h3>
                  <div class="meta">${v.ano} · ${v.placa}</div>
                </div>
                <div style="display:flex;align-items:center;gap:10px">
                  <span class="km-badge">${fmtKm(v.km)} km</span>
                  <div class="actions-row">
                    <button class="btn btn-sm btn-outline btn-icon" title="Editar" onclick="abrirModalVeiculo('${v.id}')">✏️</button>
                    <button class="btn btn-sm btn-outline btn-icon" title="Excluir" onclick="excluirVeiculo('${v.id}')">🗑️</button>
                  </div>
                </div>
              </div>
              <div class="stats-row">
                <div>
                  <div class="stat-label">Próxima revisão</div>
                  <div class="stat-value" style="color:${prox.cor}">${prox.texto}</div>
                </div>
                <div>
                  <div class="stat-label">Último abastecimento</div>
                  <div class="stat-value">${ultimoAbastTexto(v.id)}</div>
                </div>
              </div>
            </div>`;
        });
      }
      el.innerHTML = html;

    function atualizarKmAnterior() {
      const sel = document.getElementById('ab-veiculo');
      if (!sel) return;
      const v = DB.veiculos.find(x => x.id === sel.value);
      const input = document.getElementById('ab-km-ant');
      if (v && input) input.value = v.ultimoAbastKm || v.km;
    }

    function previewFoto(input, previewId) {
      const preview = document.getElementById(previewId);
      if (!preview || !input.files || !input.files[0]) return;
      const reader = new FileReader();
      reader.onload = e => { preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`; };
      reader.readAsDataURL(input.files[0]);
    }

    function salvarAbastecimento() {
      const veiculoId = document.getElementById('ab-veiculo').value;
      const km = parseInt(document.getElementById('ab-km').value, 10);
      const litros = parseFloat(document.getElementById('ab-litros').value);
      const valor = parseFloat(document.getElementById('ab-valor').value);
      const v = DB.veiculos.find(x => x.id === veiculoId);

      if (!v) { toast('Selecione um veículo'); return; }
      if (isNaN(km) || km < 0) { toast('Informe o km atual'); return; }
      if (isNaN(litros) || litros <= 0) { toast('Informe os litros'); return; }
      if (isNaN(valor) || valor <= 0) { toast('Informe o valor'); return; }
      if (km < (v.ultimoAbastKm || 0)) {
        toast('Km atual não pode ser menor que o anterior');
        return;
      }

      DB.abastecimentos.unshift({
        id: uid(),
        veiculoId,
        data: new Date().toISOString().slice(0, 10),
        km, litros, valor
      });
      v.km = km;
      v.ultimoAbastKm = km;
      save();
      toast('Abastecimento salvo!');
      renderDonoAbastecimento();
    }

    function renderListaAbastecimentos() {
      const lista = document.getElementById('lista-abastecimentos');
      if (!lista) return;
      const abs = DB.abastecimentos.slice(0, 10);
      if (abs.length === 0) {
        lista.innerHTML = '<div class="empty-state"><p>Nenhum abastecimento registrado.</p></div>';
        return;
      }
      lista.innerHTML = abs.map(a => {
        const v = DB.veiculos.find(x => x.id === a.veiculoId);
        const anteriores = DB.abastecimentos.filter(x => x.veiculoId === a.veiculoId && x.km < a.km);
        let media = '—';
        if (anteriores.length) {
          const ant = anteriores.sort((x, y) => y.km - x.km)[0];
          const dist = a.km - ant.km;
          if (dist > 0 && a.litros > 0) media = (dist / a.litros).toFixed(1) + ' km/L';
        }
        return `
          <div class="list-item">
            <div>
              <strong>${fmtDate(a.data)}</strong>
              <div class="meta" style="font-size:13px;color:var(--text-secondary)">${v ? v.modelo : ''} · ${a.litros} L · R$ ${a.valor.toFixed(2)} · ${media}</div>
            </div>
            <span class="km-badge">${fmtKm(a.km)} km</span>
          </div>`;
      }).join('');
    }

    function registrarManutencaoManual() {
      if (DB.veiculos.length === 0) { toast('Cadastre um veículo primeiro'); return; }
      const nomes = DB.veiculos.map((v, i) => `${i + 1}. ${v.marca} ${v.modelo}`).join('\n');
      const idx = prompt(`Qual veículo?\n${nomes}\n\nDigite o número:`);
      const i = parseInt(idx, 10) - 1;
      if (isNaN(i) || i < 0 || i >= DB.veiculos.length) return;
      const v = DB.veiculos[i];
      const nome = prompt('Nome da manutenção (ex: Troca de óleo e filtro):');
      if (!nome || !nome.trim()) return;
      if (!DB.ultimaManutencao[v.id]) DB.ultimaManutencao[v.id] = {};
      DB.ultimaManutencao[v.id][nome.trim()] = v.km;
      save();
      toast('Manutenção registrada!');
      renderDonoManutencao();
    }

    // ===================== MECÂNICA - AGENDA =====================
    function renderMecanicaAgenda() {
      const el = document.getElementById('mecanica-agenda');
      const dias = [
        { label: 'Hoje · 21/09/2026', data: '2026-09-21' },
        { label: 'Amanhã · 22/09/2026', data: '2026-09-22' },
      ];

      function slots(data) {
        const ags = DB.agendamentos.filter(a => a.data === data && a.oficinaId === 'o1');
        return HORARIOS.map(h => {
          const ag = ags.find(a => a.hora === h);
          if (ag) {
            const v = DB.veiculos.find(x => x.id === ag.veiculoId);
            const nome = v ? v.modelo : (ag.notas || 'Veículo');
            const stClass = ag.status === 'em_andamento' ? 'warn' : (ag.status === 'pendente' ? 'info' : 'ok');
            return `
              <div class="slot occupied">
                <div>
                  <div class="slot-time">${h} · ${nome}</div>
                  <div class="slot-meta">${ag.cliente} · ${ag.servico}</div>
                </div>
                <div style="display:flex;gap:8px;align-items:center">
                  <span class="status ${stClass}">${ag.status.replace('_', ' ')}</span>
                  ${ag.status === 'pendente' ? `<button class="btn btn-sm btn-success" onclick="confirmarAg('${ag.id}')">Confirmar</button>` : ''}
                </div>
              </div>`;
          }
          return `
            <div class="slot free">
              <div class="slot-time">${h} · Disponível</div>
              <button class="btn btn-sm btn-success" onclick="toast('Horário ${h} aberto')">Abrir</button>
            </div>`;
        }).join('');
      }

      el.innerHTML = `
        <div class="page-header">
          <div><h2>Agenda</h2><p>Oficina Central</p></div>
        </div>
        ${dias.map(d => `
          <div class="agenda-day">
            <h4>${d.label}</h4>
            ${slots(d.data)}
          </div>`).join('')}
      `;
    }

    function confirmarAg(id) {
      const ag = DB.agendamentos.find(a => a.id === id);
      if (ag) {
        ag.status = 'confirmado';
        save();
        toast('Agendamento confirmado');
        renderMecanicaAgenda();
      }
    }

    // ===================== MECÂNICA - SERVIÇOS =====================
    function renderMecanicaServicos() {
      const el = document.getElementById('mecanica-servicos');
      let html = `
        <div class="page-header">
          <div><h2>Serviços realizados</h2><p>${DB.servicos.length} registro${DB.servicos.length !== 1 ? 's' : ''}</p></div>
        </div>
        <div class="card">`;
      if (DB.servicos.length === 0) {
        html += `<div class="empty-state"><div class="empty-icon">✅</div><p>Nenhum serviço registrado ainda.</p></div>`;
      } else {
        DB.servicos.forEach(s => {
          const v = DB.veiculos.find(x => x.id === s.veiculoId);
          html += `
            <div class="list-item">
              <div>
                <strong style="font-size:14px">${v ? v.modelo : 'Veículo'} · ${s.cliente}</strong>
                <div style="font-size:13px;color:var(--text-secondary)">${fmtDate(s.data)} · ${s.itens.join(', ')} · ${fmtKm(s.km)} km</div>
              </div>
            </div>`;
        });
      }
      html += `</div>`;
      el.innerHTML = html;
    }

    // ===================== MECÂNICA - REGISTRAR =====================
    function renderMecanicaNovoServico() {
      const el = document.getElementById('mecanica-novo-servico');
      const ativos = DB.agendamentos.filter(a => ['confirmado', 'em_andamento', 'pendente'].includes(a.status));
      const opts = ativos.map(a => {
        const v = DB.veiculos.find(x => x.id === a.veiculoId);
        return `<option value="${a.id}">${a.cliente} · ${v ? v.modelo : a.servico} (${fmtDate(a.data)} ${a.hora})</option>`;
      }).join('');

      el.innerHTML = `
        <div class="page-header">
          <div><h2>Registrar Serviço</h2><p>Finalize o atendimento e atualize o histórico</p></div>
        </div>
        <div class="card">
          <div class="form-group">
            <label>Agendamento / Cliente</label>
            <select id="sv-ag">${opts || '<option value="">Nenhum agendamento ativo</option>'}</select>
          </div>
          <div class="form-group">
            <label>Km no momento do serviço *</label>
            <input type="number" id="sv-km" placeholder="Ex: 87620" />
          </div>
          <div class="form-group">
            <label>Itens realizados</label>
            <div class="check-list">
              <label><input type="checkbox" value="Troca de óleo" checked> Troca de óleo</label>
              <label><input type="checkbox" value="Filtro de óleo" checked> Filtro de óleo</label>
              <label><input type="checkbox" value="Filtro de ar"> Filtro de ar</label>
              <label><input type="checkbox" value="Pastilhas de freio"> Pastilhas de freio</label>
              <label><input type="checkbox" value="Fluido de freio"> Fluido de freio</label>
              <label><input type="checkbox" value="Correia dentada"> Correia dentada</label>
            </div>
          </div>
          <div class="form-group">
            <label>Fotos dos itens / serviço</label>
            <div class="photo-area" onclick="document.getElementById('sv-fotos').click()">
              <div id="sv-preview">📷 Adicionar fotos</div>
              <input type="file" id="sv-fotos" accept="image/*" multiple capture="environment" style="display:none"
                onchange="previewMulti(this,'sv-preview')" />
            </div>
          </div>
          <div class="form-group">
            <label>Observações</label>
            <textarea id="sv-obs" rows="3" placeholder="Observações técnicas, recomendações ao cliente..."></textarea>
          </div>
          <button class="btn btn-success btn-block" onclick="finalizarServico()">Finalizar e registrar serviço</button>
        </div>
      `;
    }

    function previewMulti(input, previewId) {
      const preview = document.getElementById(previewId);
      if (!preview || !input.files || !input.files.length) return;
      let html = '<div class="photo-thumbs">';
      Array.from(input.files).forEach(f => {
        html += `<img src="${URL.createObjectURL(f)}" alt="foto">`;
      });
      html += '</div>';
      preview.innerHTML = html;
    }

    function finalizarServico() {
      const agId = document.getElementById('sv-ag').value;
      const km = parseInt(document.getElementById('sv-km').value, 10);
      const obs = document.getElementById('sv-obs').value.trim();
      const checks = [...document.querySelectorAll('.check-list input:checked')].map(c => c.value);

      if (!agId) { toast('Selecione um agendamento'); return; }
      if (isNaN(km) || km < 0) { toast('Informe o km'); return; }
      if (checks.length === 0) { toast('Marque pelo menos um item'); return; }

      const ag = DB.agendamentos.find(a => a.id === agId);
      if (!ag) { toast('Agendamento não encontrado'); return; }

      const v = DB.veiculos.find(x => x.id === ag.veiculoId);
      if (v) {
        if (km > v.km) v.km = km;
        if (!DB.ultimaManutencao[v.id]) DB.ultimaManutencao[v.id] = {};
        checks.forEach(item => {
          const key = PREVENTIVAS.find(p =>
            p.nome.toLowerCase().includes(item.toLowerCase().split(' ')[0])
          )?.nome || item;
          DB.ultimaManutencao[v.id][key] = km;
        });
      }

      DB.servicos.unshift({
        id: uid(),
        veiculoId: ag.veiculoId,
        oficinaId: ag.oficinaId,
        data: new Date().toISOString().slice(0, 10),
        km,
        itens: checks,
        fotos: [],
        observacoes: obs,
        cliente: ag.cliente
      });
      ag.status = 'concluido';
      save();
      toast('Serviço registrado com sucesso!');
      renderMecanicaNovoServico();
    }
  </script>
</body>
</html>
